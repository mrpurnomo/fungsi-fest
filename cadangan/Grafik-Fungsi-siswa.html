<style>/* Grafik Fungsi — tema cerah. Semua komponen kustom (tanpa tampilan bawaan peramban). Landscape saja. */
:root {
  color-scheme: light;
  --awan: #F5F6FC; --putih: #fff; --tinta: #1E1B4B; --tinta-2: #4A4775; --tinta-3: #6B6894; --garis: #E6E4F4; --garis-2: #D3CFEA;
  --markisa: #6D35E8; --markisa-tua: #5321C2; --markisa-muda: #F3EEFE; --markisa-100: #E4D9FC;
  --mentari: #FFC233; --mentari-100: #FFF1C7; --mentari-800: #7A5600;
  --mint: #12B886; --mint-100: #DDF7EE; --mint-800: #0A6B50;
  --koral: #F2495C; --koral-100: #FFE3E7; --koral-800: #B5192D;
  --jingga: #FF9F1C; --jingga-100: #FFEBD0; --jingga-800: #8F4A00;
  /* sembilan keluarga fungsi */
  --f-poli: #9B5DE5; --f-poli-t: #F0E8FC; --f-poli-d: #5E2CA5;
  --f-eksp: #FF8A1F; --f-eksp-t: #FFEFD9; --f-eksp-d: #A8520A;
  --f-log: #14B8A6; --f-log-t: #DDF8F4; --f-log-d: #0B6B60;
  --f-trig: #2EA7F2; --f-trig-t: #E1F3FE; --f-trig-d: #0A6399;
  --f-rasional: #F15BB5; --f-rasional-t: #FDE6F3; --f-rasional-d: #A3196F;
  --f-akar: #7BC043; --f-akar-t: #EAF7DC; --f-akar-d: #3F6F10;
  --f-mutlak: #F5B700; --f-mutlak-t: #FFF3CC; --f-mutlak-d: #7A5A00;
  --f-tangga: #EF5B4C; --f-tangga-t: #FFE5E1; --f-tangga-d: #A2271B;
  --f-sepotong: #4F5BD5; --f-sepotong-t: #E6E8FB; --f-sepotong-d: #2B3499;
  --r: .9rem; --r-lg: 1.3rem; --bayang: 0 .1rem .2rem rgba(48,30,120,.07), 0 .6rem 1.4rem -.6rem rgba(48,30,120,.22);
  --tampil: "Bricolage", "Segoe UI", system-ui, sans-serif; --isi: "Instrument", "Segoe UI", system-ui, sans-serif; --mat: "Lora Math", "Cambria Math", Cambria, Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.2,.8,.2,1); --pegas: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: max(11px, min(calc(100vw / 74), calc(100vh / 51))); height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
body { margin: 0; height: 100%; overflow: hidden; font-family: var(--isi); font-size: 1.05rem; line-height: 1.45; color: var(--tinta); background: var(--awan); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
h1, h2, h3, h4 { font-family: var(--tampil); margin: 0 0 .3em; line-height: 1.1; letter-spacing: -.01em; }
h1 { font-size: 2.6rem; } h2 { font-size: 1.9rem; } h3 { font-size: 1.25rem; } p { margin: 0 0 .6em; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.kode, input { user-select: text; -webkit-user-select: text; }
.muted { color: var(--tinta-3); } .kecil { font-size: .85rem; } .tengah { text-align: center; } .tebal { font-weight: 700; }
.mat { font-family: var(--mat); font-style: italic; }

/* ---------- scrollbar kustom ---------- */
.gulir { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--markisa) transparent; -webkit-overflow-scrolling: touch; }
.gulir::-webkit-scrollbar { width: .55rem; height: .55rem; }
.gulir::-webkit-scrollbar-track { background: transparent; }
.gulir::-webkit-scrollbar-thumb { background: var(--markisa-100); border-radius: 1rem; border: .12rem solid transparent; background-clip: padding-box; }
.gulir::-webkit-scrollbar-thumb:hover, .gulir::-webkit-scrollbar-thumb:active { background: var(--markisa); background-clip: padding-box; }

/* ---------- kerangka aplikasi ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; background:
  radial-gradient(40rem 22rem at 4% -6rem, #FFE7A3 0, rgba(255,231,163,0) 70%), radial-gradient(40rem 22rem at 98% -5rem, #E4D9FC 0, rgba(228,217,252,0) 70%), var(--awan); }
.bar-atas { flex: none; display: flex; align-items: center; gap: 1rem; padding: .55rem 2.2rem; height: 3.4rem; }
.logo { font-family: var(--tampil); font-weight: 700; font-size: 1.45rem; letter-spacing: -.02em; display: inline-flex; gap: .4rem; align-items: center; }
.logo b { background: var(--mentari); padding: 0 .35em .05em; border-radius: .5rem; transform: rotate(-3deg); display: inline-block; box-shadow: 0 .14rem 0 rgba(122,86,0,.28); }
.bar-atas .ruang { flex: 1; }
.bar-bawah { flex: none; display: flex; align-items: center; gap: .8rem; padding: .6rem 1.4rem .8rem; min-height: 4.2rem; }
.panggung { flex: 1; min-height: 0; position: relative; margin: .4rem 2.2rem 1rem; padding: 0; display: flex; flex-direction: column; }
.layar { position: absolute; inset: 0; display: flex; flex-direction: column; animation: masuk .45s var(--ease) both; }
@keyframes masuk { from { opacity: 0; transform: translateY(.8rem) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes keluar { to { opacity: 0; transform: translateY(-.6rem); } }

/* ---------- komponen ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3rem; padding: 0 1.4rem; border: .14rem solid var(--markisa); border-radius: var(--r); background: var(--markisa); color: #fff; font-weight: 700; font-size: 1.05rem; cursor: pointer; box-shadow: 0 .2rem 0 var(--markisa-tua); transition: transform .08s, box-shadow .08s, background .15s, opacity .2s; touch-action: manipulation; white-space: nowrap; }
.btn:active { transform: translateY(.2rem); box-shadow: 0 0 0 var(--markisa-tua); }
.btn.sekunder { background: #fff; color: var(--markisa-tua); border-color: var(--garis-2); box-shadow: 0 .2rem 0 var(--garis-2); }
.btn.hijau { background: var(--mint); border-color: var(--mint); color: #04382A; box-shadow: 0 .2rem 0 #0C8F69; }
.btn.sorot { background: var(--mentari); border-color: var(--mentari); color: var(--tinta); box-shadow: 0 .2rem 0 #C79300; }
.btn.bahaya { background: var(--koral); border-color: var(--koral); box-shadow: 0 .2rem 0 #C32F42; }
.btn.besar { min-height: 3.6rem; font-size: 1.25rem; padding: 0 2.2rem; border-radius: 1.1rem; }
.btn.kecil { min-height: 2.4rem; padding: 0 .9rem; font-size: .9rem; border-radius: .7rem; }
.btn[disabled], .btn.mati { opacity: .45; pointer-events: none; box-shadow: none; }
.btn.denyut { animation: denyut 1.6s infinite; }
@keyframes denyut { 0%,100% { box-shadow: 0 .2rem 0 var(--markisa-tua), 0 0 0 0 rgba(109,53,232,.5); } 60% { box-shadow: 0 .2rem 0 var(--markisa-tua), 0 0 0 .9rem rgba(109,53,232,0); } }
.kartu { background: #fff; border: 1px solid var(--garis); border-radius: var(--r-lg); box-shadow: var(--bayang); padding: 1.1rem 1.3rem; }
.chip { display: inline-flex; align-items: center; gap: .4rem; padding: .15rem .8rem; border-radius: 99px; font-weight: 700; font-size: .85rem; background: var(--markisa-muda); color: var(--markisa-tua); white-space: nowrap; }
.chip.ok { background: var(--mint-100); color: var(--mint-800); } .chip.warn { background: var(--jingga-100); color: var(--jingga-800); } .chip.bad { background: var(--koral-100); color: var(--koral-800); } .chip.abu { background: #EEEDF7; color: var(--tinta-2); } .chip.sorot { background: var(--mentari-100); color: var(--mentari-800); }
.ik { width: 1.3rem; height: 1.3rem; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ik.besar { width: 2rem; height: 2rem; } .ik.kecil { width: 1rem; height: 1rem; }
.eyebrow { display: inline-flex; align-items: center; gap: .5rem; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); margin-bottom: .3rem; }
.eyebrow::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--t, var(--markisa)); }
.baris { display: flex; gap: .8rem; align-items: center; } .kolom { display: flex; flex-direction: column; gap: .8rem; }
.fx-poli { --t: var(--f-poli); --tt: var(--f-poli-t); --td: var(--f-poli-d); } .fx-eksp { --t: var(--f-eksp); --tt: var(--f-eksp-t); --td: var(--f-eksp-d); }
.fx-log { --t: var(--f-log); --tt: var(--f-log-t); --td: var(--f-log-d); } .fx-trig { --t: var(--f-trig); --tt: var(--f-trig-t); --td: var(--f-trig-d); }
.fx-rasional { --t: var(--f-rasional); --tt: var(--f-rasional-t); --td: var(--f-rasional-d); } .fx-akar { --t: var(--f-akar); --tt: var(--f-akar-t); --td: var(--f-akar-d); }
.fx-mutlak { --t: var(--f-mutlak); --tt: var(--f-mutlak-t); --td: var(--f-mutlak-d); } .fx-tangga { --t: var(--f-tangga); --tt: var(--f-tangga-t); --td: var(--f-tangga-d); }
.fx-sepotong { --t: var(--f-sepotong); --tt: var(--f-sepotong-t); --td: var(--f-sepotong-d); }
.ubin { width: 3rem; height: 3rem; border-radius: .95rem; display: grid; place-items: center; flex: none; padding: .6rem; color: #fff; background: var(--t, var(--markisa)); box-shadow: 0 .2rem 0 rgba(30,27,75,.18); }
.ubin svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- dialog / popup ---------- */
.tirai { position: fixed; inset: 0; z-index: 500; background: rgba(30,27,75,.5); backdrop-filter: blur(.25rem); display: grid; place-items: center; padding: 1.5rem; animation: pudar .22s both; }
.tirai.tutup { animation: pudar-keluar .2s both; }
@keyframes pudar { from { opacity: 0; } } @keyframes pudar-keluar { to { opacity: 0; } }
.dialog { background: #fff; border-radius: 1.6rem; box-shadow: 0 2rem 4rem -1rem rgba(30,27,75,.5); width: min(46rem, 100%); max-height: 100%; display: flex; flex-direction: column; animation: muncul .35s var(--pegas) both; overflow: hidden; }
.tirai.tutup .dialog { animation: hilang .18s both; }
@keyframes muncul { from { opacity: 0; transform: scale(.88) translateY(1rem); } } @keyframes hilang { to { opacity: 0; transform: scale(.94); } }
.dialog .kepala { padding: 1.2rem 1.6rem .4rem; display: flex; gap: .8rem; align-items: center; }
.dialog .kepala h3 { margin: 0; font-size: 1.5rem; }
.dialog .badan { padding: .4rem 1.6rem 1rem; flex: 1; min-height: 0; font-size: 1.1rem; }
.dialog .kaki { padding: .8rem 1.6rem 1.3rem; display: flex; gap: .8rem; justify-content: flex-end; flex-wrap: wrap; }
.dialog.lebar { width: min(64rem, 100%); }
.dialog .tutup-x { margin-left: auto; width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 0; background: #EEEDF7; display: grid; place-items: center; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 5rem; transform: translateX(-50%); z-index: 600; background: var(--tinta); color: #fff; padding: .7rem 1.4rem; border-radius: 99px; font-weight: 700; box-shadow: var(--bayang); animation: naik .3s var(--pegas) both; display: flex; gap: .6rem; align-items: center; }
@keyframes naik { from { opacity: 0; transform: translate(-50%, 1rem); } }

/* ---------- papan ketik kustom ---------- */
.papan-ketik { display: grid; gap: .5rem; margin-top: .6rem; }
.papan-ketik .tampil { display: flex; gap: .5rem; justify-content: center; margin-bottom: .4rem; }
.papan-ketik .sel { width: 3.2rem; height: 4rem; border-radius: .9rem; border: .14rem solid var(--garis-2); display: grid; place-items: center; font-family: var(--tampil); font-weight: 700; font-size: 2rem; background: #fff; }
.papan-ketik .sel.isi { border-color: var(--markisa); background: var(--markisa-muda); color: var(--markisa-tua); }
.papan-ketik .tuts { display: grid; gap: .45rem; grid-template-columns: repeat(var(--kol, 8), 1fr); }
.papan-ketik .tut { min-height: 3rem; border-radius: .8rem; border: .12rem solid var(--garis); background: #fff; font-weight: 700; font-size: 1.2rem; cursor: pointer; box-shadow: 0 .15rem 0 var(--garis-2); touch-action: manipulation; }
.papan-ketik .tut:active { transform: translateY(.15rem); box-shadow: none; background: var(--markisa-muda); }
.papan-ketik .tut.fungsi { background: #EEEDF7; font-size: .95rem; }

/* ---------- putar tablet (hanya landscape) ---------- */
#putar { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; background: linear-gradient(160deg, #6D35E8, #4F5BD5 55%, #2EA7F2); color: #fff; text-align: center; padding: 2rem; }
@media (orientation: portrait) { #putar { display: flex; } #app { visibility: hidden; } }
#putar h2 { color: #fff; font-size: 7vw; } #putar p { font-size: 4vw; opacity: .9; max-width: 80vw; }
.tablet { width: 28vw; height: 40vw; border: .9vw solid #fff; border-radius: 3.2vw; position: relative; animation: putar 3.2s var(--ease) infinite; box-shadow: 0 2vw 5vw rgba(0,0,0,.25); background: rgba(255,255,255,.12); }
.tablet::before { content: ""; position: absolute; left: 50%; bottom: 2.4vw; width: 5vw; height: 1vw; margin-left: -2.5vw; background: #fff; border-radius: 1vw; }
.tablet::after { content: ""; position: absolute; inset: 5vw 3vw 6vw; border-radius: 1.2vw; background: repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 1vw, transparent 1vw 3vw); }
@keyframes putar { 0%, 15% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { .tablet, .btn.denyut { animation: none; } }

/* ---------- rumus ---------- */
.rumus { font-family: var(--mat); font-size: 3.2rem; line-height: 1.3; white-space: pre; }
.rumus .v { font-style: italic; } .rumus .tok { display: inline-block; transition: color .3s; }
.warna-x { color: var(--f-eksp); } .warna-y { color: var(--mint); } .warna-hasil { color: var(--markisa); }

.layar-angka { text-align: center; font-family: var(--tampil); font-size: 3rem; font-weight: 700; padding: .4rem; margin: .6rem auto; max-width: 18rem; border-radius: 1rem; background: var(--markisa-muda); color: var(--markisa-tua); min-height: 4.4rem; } .layar-angka.kosong { color: var(--garis-2); }
.tuts-angka { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; max-width: 18rem; margin: 0 auto; } .tuts-angka .tut { min-height: 3.3rem; border-radius: .8rem; border: .12rem solid var(--garis); background: #fff; font-weight: 700; font-size: 1.4rem; cursor: pointer; box-shadow: 0 .15rem 0 var(--garis-2); } .tuts-angka .tut:active { transform: translateY(.15rem); box-shadow: none; background: var(--markisa-muda); } .tuts-angka .tut.fungsi { background: #EEEDF7; }
.teks-soal-d { font-size: 1.5rem; line-height: 1.4; text-align: center; } .teks-soal-d i, .teks-soal i { font-family: var(--mat); }

/* ---------- matematika ---------- */
sup { font-size: .68em; line-height: 0; vertical-align: baseline; position: relative; top: -.62em; margin-left: .04em; } i { font-family: var(--mat); padding-right: .07em; }
.frak { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; font-size: .85em; } .frak .at { border-bottom: .08em solid currentColor; padding: 0 .25em; } .frak .bw { padding: 0 .25em; }
.akar { display: inline-flex; align-items: flex-end; } .akar .di { border-top: .07em solid currentColor; padding: 0 .15em; margin-left: -.04em; }
.cabang { display: inline-flex; align-items: center; gap: .3em; white-space: nowrap; } .kurawal { font-size: 3em; line-height: 1; font-weight: 300; transform: scaleX(.6); font-family: var(--isi); } .isi-cabang { display: flex; flex-direction: column; gap: .2em; text-align: left; }

/* Pengantar (animasi bergaya motion graphic). Dipakai bersama oleh tablet siswa dan layar guru. */
.intro { position: absolute; inset: 0; display: flex; flex-direction: column; }
.intro .kepala-intro { flex: none; display: flex; align-items: center; gap: .8rem; padding: .5rem 1rem; margin-bottom: .7rem; background: #fff; border: 1px solid var(--garis); border-radius: 1.3rem; box-shadow: var(--bayang); }
.intro .kepala-intro h2 { margin: 0; font-size: 1.5rem; }
.intro .adegan { flex: 1; min-height: 0; position: relative; display: flex; align-items: stretch; justify-content: center; padding-bottom: .2rem; }
.intro .kendali { flex: none; display: flex; align-items: center; gap: .8rem; padding: .55rem .9rem; margin-top: .7rem; background: #fff; border: 1px solid var(--garis); border-radius: 1.3rem; box-shadow: var(--bayang); }
.intro .titik-langkah { flex: 1; display: flex; gap: .45rem; justify-content: center; }
.intro .titik-langkah i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--garis-2); transition: all .3s var(--ease); }
.intro .titik-langkah i.sudah { background: var(--markisa-100); } .intro .titik-langkah i.aktif { width: 2rem; border-radius: .5rem; background: var(--markisa); }
.hero { margin: auto; text-align: center; max-width: 56rem; padding: 2rem 3rem; }
.hero h1 { font-size: 3.6rem; } .hero .hl { background: linear-gradient(transparent 58%, var(--mentari) 58%); padding: 0 .2em; }
.hero p { font-size: 1.35rem; color: var(--tinta-2); }
.pita { display: inline-flex; align-items: center; gap: .6rem; padding: .5rem 1.2rem; border-radius: 99px; background: var(--f-eksp-t); color: var(--f-eksp-d); font-weight: 700; font-size: 1.3rem; }
.sorotan { background: var(--mentari-100); border-radius: 1rem; padding: .8rem 1.2rem; font-size: 1.25rem; font-weight: 600; color: #5A4300; }
.subst { margin: auto; width: 100%; max-width: 62rem; display: flex; flex-direction: column; gap: .6rem; align-items: center; }
.subst .rumus { display: flex; align-items: baseline; gap: .1rem; }
.subst .rumus .tok { display: inline-block; min-width: .1rem; }
.subst .rumus .slot { color: var(--f-eksp); font-weight: 700; }
.subst .rumus .hasil { color: var(--mint); font-weight: 700; } .subst .rumus .antara { color: var(--markisa); font-weight: 700; }
.subst .baris-rumus { min-height: 4.4rem; display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(.8rem); }
.subst .cip-x { display: inline-flex; align-items: center; gap: .5rem; background: var(--f-eksp); color: #fff; font-family: var(--mat); font-style: italic; font-size: 2rem; font-weight: 700; padding: .2rem 1.1rem; border-radius: 1rem; box-shadow: 0 .25rem 0 rgba(143,74,0,.35); opacity: 0; }
.subst .titik-hasil { opacity: 0; display: inline-flex; gap: .7rem; align-items: center; background: var(--markisa-muda); border: .14rem solid var(--markisa); border-radius: 1.2rem; padding: .5rem 1.4rem; font-size: 1.6rem; font-weight: 700; color: var(--markisa-tua); }
.subst .titik-hasil .mat { font-size: 2rem; }
.terbang { position: fixed; z-index: 300; pointer-events: none; background: var(--f-eksp); color: #fff; font-family: var(--mat); font-style: italic; font-weight: 700; font-size: 1.8rem; padding: .1rem .8rem; border-radius: .8rem; }
.mesin-adegan { flex: 1; display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 1rem; align-items: center; padding: .4rem 0; }
.baki { background: #fff; border: .14rem dashed var(--garis-2); border-radius: 1.3rem; padding: .8rem; min-height: 15rem; display: flex; flex-direction: column; gap: .6rem; align-items: center; }
.baki h4 { margin: 0 0 .2rem; font-size: 1.05rem; color: var(--tinta-3); text-transform: uppercase; letter-spacing: .06em; }
.chip-angka { min-width: 4.8rem; padding: .5rem 1rem; border-radius: 1rem; text-align: center; font-family: var(--mat); font-style: italic; font-weight: 700; font-size: 2rem; cursor: grab; background: var(--f-eksp); color: #fff; box-shadow: 0 .25rem 0 rgba(143,74,0,.35); user-select: none; touch-action: none; animation: goyang 2.4s ease-in-out infinite; }
.chip-angka.pakai { animation: none; opacity: .25; pointer-events: none; }

@keyframes goyang { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-.15rem); } }
.mesin { position: relative; background: linear-gradient(160deg, #6D35E8, #4F5BD5); border-radius: 2rem; color: #fff; padding: 1.1rem 1.3rem 1.4rem; text-align: center; box-shadow: 0 .6rem 0 #3C169A, 0 2rem 3rem -1rem rgba(60,22,154,.5); }
.mesin .judul-mesin { font-family: var(--mat); font-size: 1.9rem; font-weight: 700; margin-bottom: .6rem; }
.mesin .lubang { margin: 0 auto; width: 70%; height: 4.2rem; border-radius: 1rem; background: rgba(0,0,0,.28); display: grid; place-items: center; font-size: 1rem; color: rgba(255,255,255,.75); border: .14rem dashed rgba(255,255,255,.4); transition: all .2s; }
.mesin .lubang.sambut { background: rgba(255,194,51,.35); border-color: var(--mentari); transform: scale(1.04); }
.mesin .roda-baris { display: flex; justify-content: center; gap: .6rem; margin: .8rem 0; }
.roda { width: 3.8rem; height: 3.8rem; } .roda svg { width: 100%; height: 100%; }
.mesin.jalan .roda svg { animation: gir 1.1s linear infinite; } .mesin.jalan .roda:nth-child(2) svg { animation-direction: reverse; }
@keyframes gir { to { transform: rotate(360deg); } }
.mesin.jalan { animation: getar .12s linear infinite; }
@keyframes getar { 0% { transform: translate(0,0); } 25% { transform: translate(.12rem,-.08rem); } 75% { transform: translate(-.12rem,.08rem); } }
.layar-hitung { background: #0F0C2E; border-radius: .9rem; padding: .5rem; min-height: 3rem; font-family: var(--mat); font-size: 1.5rem; color: #9CF5D3; display: grid; place-items: center; }
.corong { margin: .6rem auto 0; width: 34%; height: 1.4rem; background: rgba(0,0,0,.35); border-radius: 0 0 1.2rem 1.2rem; }
.panel-titik { margin-top: .6rem; background: #fff; border: 1px solid var(--garis); border-radius: 1.2rem; padding: .6rem 1rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; min-height: 3.6rem; }
.panel-titik .lab { font-weight: 700; color: var(--tinta-3); font-size: .9rem; text-transform: uppercase; letter-spacing: .05em; }
.cip-titik { display: inline-flex; align-items: center; padding: .15rem .8rem; border-radius: .8rem; background: var(--markisa-muda); color: var(--markisa-tua); font-weight: 700; font-size: 1.15rem; border: .1rem solid var(--markisa-100); }
.plot-adegan { flex: 1; display: grid; grid-template-columns: 17rem 1fr; gap: 1rem; min-height: 0; }
.tabel-titik { background: #fff; border: 1px solid var(--garis); border-radius: 1.2rem; padding: .8rem; display: flex; flex-direction: column; gap: .4rem; align-self: center; }
.tabel-titik .b { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; text-align: center; font-weight: 700; padding: .35rem; border-radius: .7rem; font-size: 1.2rem; background: #F8F7FD; transition: all .3s; }
.tabel-titik .b.kepala { background: transparent; font-size: .85rem; color: var(--tinta-3); text-transform: uppercase; letter-spacing: .04em; }
.tabel-titik .b.sorot { background: var(--mentari-100); transform: scale(1.06); box-shadow: 0 .3rem 1rem -.3rem rgba(122,86,0,.4); }
.tabel-titik .b.selesai { background: var(--markisa-muda); color: var(--markisa-tua); }
.kotak-grafik { position: relative; min-height: 0; display: flex; flex-direction: column; }
.kotak-grafik .wadah { flex: 1; min-height: 0; background: #fff; border: 1px solid var(--garis); border-radius: 1.4rem; padding: .6rem; box-shadow: var(--bayang); }
.kotak-grafik .keterangan { position: static; flex: none; margin: 0 0 .5rem .3rem; display: flex; gap: .5rem; flex-wrap: wrap; }
.denyut-label { animation: denyutl 1s ease-in-out 3; } @keyframes denyutl { 50% { transform: scale(1.35); } }
.galeri { flex: 1; display: grid; grid-template-columns: 14rem 1fr; gap: 1rem; min-height: 0; }
.galeri .daftar { display: flex; flex-direction: column; gap: .35rem; padding-right: .3rem; }
.galeri .tab { display: flex; align-items: center; gap: .6rem; padding: .35rem .6rem .35rem .4rem; border-radius: 1rem; border: .12rem solid transparent; background: #fff; cursor: pointer; text-align: left; font-weight: 700; font-size: .95rem; color: var(--tinta-2); position: relative; }
.galeri .tab .ubin { width: 2.2rem; height: 2.2rem; padding: .4rem; border-radius: .7rem; }
.galeri .tab.aktif { border-color: var(--t); background: var(--tt); color: var(--td); } .galeri .tab .centang { margin-left: auto; flex: none; color: var(--mint); opacity: 0; } .galeri .tab.lihat .centang { opacity: 1; }
.galeri .isi { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1rem; min-height: 0; animation: masuk .4s var(--ease) both; }
.galeri .info { display: flex; flex-direction: column; gap: .7rem; min-height: 0; }
.galeri .rumus-kartu { background: var(--tt); border-radius: 1.2rem; padding: .7rem 1.1rem; color: var(--td); }
.galeri .rumus-kartu .mat { font-size: 2.1rem; font-style: normal; font-weight: 700; line-height: 1.2; }
.galeri ul { margin: .2rem 0 0; padding-left: 1.2rem; font-size: 1.05rem; } .galeri li { margin: .2rem 0; }
.seg-varian { display: flex; gap: .4rem; flex-wrap: wrap; }
.seg-varian button { border: .12rem solid var(--garis-2); background: #fff; border-radius: 99px; padding: .25rem .9rem; font-weight: 700; font-size: .9rem; cursor: pointer; color: var(--tinta-2); }
.seg-varian button.aktif { background: var(--t); border-color: var(--t); color: #fff; }
.tujuan-daftar { margin: auto; max-width: 56rem; display: flex; flex-direction: column; gap: .8rem; width: 100%; }
.tujuan { display: flex; gap: 1rem; align-items: center; background: #fff; border: 1px solid var(--garis); border-radius: 1.3rem; padding: .9rem 1.3rem; font-size: 1.3rem; font-weight: 600; box-shadow: var(--bayang); opacity: 0; transform: translateX(2rem); }
.tujuan .no { width: 2.8rem; height: 2.8rem; border-radius: 50%; background: var(--markisa); color: #fff; display: grid; place-items: center; font-family: var(--tampil); font-weight: 700; font-size: 1.4rem; flex: none; }
.konfeti { position: fixed; width: .6rem; height: 1rem; z-index: 450; pointer-events: none; border-radius: .15rem; }

.layar-hitung { white-space: nowrap; overflow: hidden; display: block; text-align: center; line-height: 2.1rem; }

.kecepatan { display: flex; align-items: center; gap: .35rem; padding: .2rem .3rem .2rem .7rem; border: 1px solid var(--garis); border-radius: 99px; background: #F8F7FD; } .kecepatan button { min-width: 2.6rem; min-height: 2.2rem; border: 0; border-radius: 99px; background: transparent; font-weight: 700; color: var(--tinta-2); cursor: pointer; } .kecepatan button.aktif { background: var(--markisa); color: #fff; box-shadow: 0 .12rem 0 var(--markisa-tua); }
.chip-angka.ketuk { cursor: pointer; }

/* Tata letak layar-layar aplikasi (landscape). */
.layar.tengah-layar { align-items: center; justify-content: center; text-align: center; }
.tengah-isi { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; text-align: center; max-width: 50rem; margin: auto; }
.umpan { display: flex; gap: .6rem; align-items: center; padding: .6rem 1rem; border-radius: 1rem; background: var(--markisa-muda); color: var(--markisa-tua); font-weight: 600; }
.umpan.ok { background: var(--mint-100); color: var(--mint-800); } .umpan.hint { background: var(--mentari-100); color: var(--mentari-800); }
.spinner { width: 3.4rem; height: 3.4rem; border-radius: 50%; border: .4rem solid var(--markisa-100); border-top-color: var(--markisa); animation: gir 1s linear infinite; } @keyframes gir { to { transform: rotate(360deg); } }

/* selamat datang */
.welcome { position: absolute; inset: -.4rem -2.2rem -1rem; display: grid; place-items: center; overflow: hidden; text-align: center; }
.welcome .bg-kurva { position: absolute; inset: 0; } .welcome .bg-kurva svg { width: 100%; height: 100%; } .welcome .bg-kurva path { stroke-dasharray: 30 18; animation: alir 14s linear infinite; } @keyframes alir { to { stroke-dashoffset: -480; } }
.garland-welcome { position: absolute; left: 0; right: 0; top: -.4rem; height: 4.6rem; pointer-events: none; }
.isi-welcome { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: .6rem; padding: 3rem 4rem; background: rgba(255,255,255,.72); backdrop-filter: blur(.6rem); border-radius: 2.4rem; box-shadow: var(--bayang); border: 1px solid rgba(255,255,255,.9); animation: masuk .8s var(--ease) both; }
.judul-besar { font-size: 6.2rem; margin: 0; line-height: 1; } .judul-besar .hl { background: linear-gradient(transparent 60%, var(--mentari) 60%); padding: 0 .15em; border-radius: .4rem; }
.isi-welcome .sub { font-size: 1.4rem; color: var(--tinta-2); max-width: 40rem; margin-bottom: 1.2rem; }

/* kelas dan nama */
.kartu-kelas { display: flex; align-items: center; gap: 1.4rem; padding: 1.4rem 2rem; min-width: 34rem; text-align: left; background: #fff; border: .16rem solid var(--markisa); border-radius: 1.6rem; box-shadow: 0 .3rem 0 var(--markisa-tua), var(--bayang); cursor: pointer; }
.kartu-kelas:active { transform: translateY(.25rem); box-shadow: none; } .kartu-kelas .ubin { width: 4.6rem; height: 4.6rem; } .kartu-kelas .kelas-nama { font-family: var(--tampil); font-size: 2.2rem; font-weight: 700; } .kartu-kelas > .ik { margin-left: auto; color: var(--markisa); }
.nama-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.grid-nama { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr); gap: .7rem; padding-bottom: .6rem; }
.tile-nama { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem; padding: .5rem .4rem; background: #fff; border: .12rem solid var(--garis); border-radius: 1.2rem; cursor: pointer; box-shadow: 0 .15rem 0 var(--garis-2); text-align: center; transition: transform .12s, border-color .15s; }
.tile-nama:active { transform: scale(.96); border-color: var(--t); }
.tile-nama .av { width: 2.8rem; height: 2.8rem; border-radius: 50%; background: var(--t); color: #fff; display: grid; place-items: center; font-family: var(--tampil); font-weight: 700; font-size: 1.05rem; }

    bKirim.onclick = async () => { bKirim.classList.add('mati'); status.innerHTML = ik('jam') + '<span>Mengirim…</span>'; const r = await api('hasil', { idx, jawab: P.tes.jawab, detik: P.tes.detik }); if (r.ok) { P.terkirim = true; net = 'online'; simpan(); gambarAtas(); perbarui(); konfeti(innerWidth / 2, innerHeight / 3, 30); } else { if (r._s === 403 || r.error === 'tidak-dikenali') { await UI.info('Nama belum terdaftar di server', '<p>Minta guru mengatur ulang, atau serahkan <b>kode hasil</b>.</p>', 'Mengerti'); } else { net = 'offline'; gambarAtas(); UI.toast('Gagal terkirim. Pakai kode hasil.', 'awas'); } perbarui(); } };
    perbarui();
    if (baru) { setTimeout(() => konfeti(innerWidth / 2, innerHeight * .3, 80), 500); }
    const arc = document.getElementById('arc'), angka = document.getElementById('angka'); const t0 = performance.now(), dur = 1400, target = n.benar / 5 * kel;
    (function f(t) { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); if (!arc.isConnected) return; arc.setAttribute('stroke-dasharray', (target * e).toFixed(1) + ' ' + kel.toFixed(1)); angka.textContent = Math.round(n.benar * e); if (k < 1) requestAnimationFrame(f); })(t0);
  }
  function pembahasan(i, soal, n) {
    const q = soal[i], h = n.hasil[i], mine = h.pilih;
    UI.dialog({ lebar: true, judul: 'Soal ' + (i + 1) + ' · ' + (h.benar ? 'Benar' : 'Salah'), ikon: ik(h.benar ? 'centang' : 'silang', 'besar'), tutupX: true, tutupLuar: true,
      isi: '<div class="teks-soal" style="font-size:1.35rem">' + q.tanya + '</div><div class="opsi-wrap" style="margin:.6rem 0">' + q.opsi.map((o, k) => '<div class="opsi ' + (k === q.kunci ? 'benar' : (k === mine ? 'salah' : '')) + '" style="cursor:default"><span class="huruf">' + HURUF[k] + '</span><span>' + esc(o) + '</span>' + (k === q.kunci ? '<span class="chip ok" style="margin-left:auto">jawaban benar</span>' : (k === mine ? '<span class="chip bad" style="margin-left:auto">jawabanmu</span>' : '')) + '</div>').join('') + '</div><div class="umpan ok" style="align-items:flex-start">' + ik('info') + '<span>' + esc(q.jelas) + '</span></div>', tombol: [{ t: 'Tutup', nilai: true }] });
  }
  function tampilKode() {
    const kode = B.buatKode(idx, P.tes.jawab);
    UI.dialog({ judul: 'Kode hasil untuk guru', ikon: ik('salin', 'besar'), isi: '<div class="tengah"><p>Berikan 5 karakter ini kepada gurumu:</p><div class="kode-besar kode">' + kode.split('').map((c) => '<span>' + c + '</span>').join('') + '</div><p class="muted kecil">Kode ini berisi namamu dan jawabanmu. Tulis persis seperti di layar.</p></div>', tombol: [{ t: 'Sudah saya serahkan', nilai: true, kelas: 'hijau' }] }).then(() => { UI.toast('Setelah itu tekan “Lihat kelompok”.', 'info'); const b = [...document.querySelectorAll('.btn')].find((x) => x.textContent.includes('Lihat kelompok')); if (b) b.classList.remove('mati'); });
  }

  /* ---------------------------------------------------------------- 7. kelompok */
  async function sKelompok() {
    kosongkanBawah(); gambarAtas(); const w = el('div', { kelas: 'kel-wrap' }); layar(w);
    const muat = async () => {
      w.innerHTML = '<div class="tengah-isi"><div class="spinner"></div><p class="muted">Menyusun kelompok…</p></div>';
      const r = await api('kelompok', { idx });
      if (r.ok && r.menunggu) { w.innerHTML = '<div class="tengah-isi"><span class="ubin fx-eksp" style="width:5rem;height:5rem">' + ik('jam') + '</span><h2>Guru belum membuka kelompok</h2><p class="muted">Tunggu sebentar, halaman ini akan memeriksa sendiri.</p></div>'; clearInterval(tmr); tmr = setTimeout(muat, 4000); return; }
      if (r.ok) { tampil(r.kelompok, r.saya); return; }
      if (r.error === 'belum-selesai') { w.innerHTML = '<div class="tengah-isi"><h2>Selesaikan tes dulu</h2></div>'; return; }
      w.innerHTML = '<div class="tengah-isi"><span class="ubin fx-tangga" style="width:5rem;height:5rem">' + ik('putus') + '</span><h2>Daftar kelompok ada di layar guru</h2><p class="muted" style="max-width:36rem">Tablet belum terhubung ke guru, jadi kelompok diumumkan lewat layar kelas. Lihat nama dan nomor kelompokmu di sana, lalu pindah ke mejanya.</p></div>'; const b = el('div', { kelas: 'baris', gaya: 'justify-content:center;margin-top:1rem' }, el('button', { kelas: 'btn sekunder', type: 'button', html: ik('ulang') + 'Coba terhubung lagi', onclick: muat }), el('button', { kelas: 'btn', type: 'button', html: 'Saya sudah tahu kelompokku' + ik('panah'), onclick: () => { P.tahap = 'lanjut'; simpan(); sLanjut(); } })); w.querySelector('.tengah-isi').append(b);
    };
    function tampil(kel, saya) {
      w.innerHTML = ''; const kepala = el('div', { kelas: 'baris', gaya: 'justify-content:space-between;margin-bottom:.6rem' }, el('div', null, el('div', { kelas: 'eyebrow' }, 'Kelompok belajar'), el('h2', { gaya: 'margin:0' }, 'Kamu di Kelompok ' + (saya + 1))), el('button', { kelas: 'btn', type: 'button', html: 'Saya sudah di meja kelompok' + ik('panah'), onclick: () => { P.tahap = 'lanjut'; simpan(); sLanjut(); } }));
      const grid = el('div', { kelas: 'grid-kel' }); w.append(kepala, el('div', { kelas: 'umpan ok', html: ik('info') + '<span>Pindahlah ke meja kelompokmu. Kelompok dibuat seimbang berdasarkan hasil tes awal.</span>' }), grid);
      kel.forEach((g, gi) => { const k = el('div', { kelas: 'kel-kartu' + (gi === saya ? ' saya' : ''), 'data-g': gi }); k.append(el('div', { kelas: 'kel-judul' }, 'Kelompok ' + (gi + 1), el('span', { kelas: 'chip abu' }, g.length + ' orang'))); g.forEach((s) => k.append(el('div', { kelas: 'kel-nama' + (s.idx === idx ? ' aku' : '') }, el('span', { kelas: 'av2 fx-' + warnaNama[s.idx % 9] }, inisial(s.nama)), el('span', null, s.nama + (s.idx === idx ? ' (kamu)' : ''))))); grid.append(k); anim(k, [{ opacity: 0, transform: 'translateY(1rem)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: gi * 120 }); });
      setTimeout(() => konfeti(innerWidth / 2, innerHeight * .25, 40), 600);
    }
    muat();
  }

  /* ---------------------------------------------------------------- 8. tahap berikutnya */
  function sLanjut() {
    gambarAtas(); Tahap2.mulai({ idx: () => idx, P: () => P, simpan, api, layar, net: () => net, gambarAtas, bawahKosong: kosongkanBawah, konfeti }); return;
    kosongkanBawah(); const w = el('div', { kelas: 'tengah-isi' }); w.innerHTML = '<span class="ubin fx-trig" style="width:5.5rem;height:5.5rem">' + UI.glif('trig') + '</span><h2>Tahap berikutnya</h2><p class="muted" style="max-width:38rem;font-size:1.2rem">Tunggu arahan gurumu. Kegiatan berikutnya dilakukan bersama kelompok.</p>';
    w.append(el('button', { kelas: 'btn sekunder', type: 'button', html: ik('kelompok') + 'Lihat kelompok lagi', onclick: () => { P.tahap = 'kelompok'; simpan(); sKelompok(); } })); layar(w, 'tengah-layar');
  }

  /* ---------------------------------------------------------------- mulai */
  UI.pasangPutar(); gambarAtas(); sWelcome(); cekJaringan();
  window.gfDebug = { intro: () => intro, P: () => P, idx: () => idx, net: () => net, ke: { welcome: sWelcome, kelas: sKelas, nama: sNama, intro: sIntro, tes: sTes, hasil: sHasil, kelompok: sKelompok, lanjut: sLanjut }, pilih: (i) => { idx = i; P = lsGet('p' + i, null) || baruP(); return P; }, set: (i, p) => { idx = i; P = p; simpan(); } };
})();
</script>
